<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT P</title><style>body{background:#111b29;color:#edf4ff;font:15px system-ui;margin:12px}main{max-width:760px;margin:auto}button{background:#314961;color:white;border:1px solid #66829c;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;background:#294b3b;border-radius:12px;touch-action:none}.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.card{flex:1;min-width:65px;text-align:center;padding:8px 2px;background:#25384d;border-radius:8px}.sel{outline:2px solid gold}small{color:#b8c8db}h2{margin:8px 0}#log{min-height:42px} </style><main><h2>PROJECT P <small>v0.0.2 · 관동 챔피언 로드</small></h2><div id="status"></div><p id="story"></p><div id="weather"></div><canvas id="field" width="600" height="420"></canvas><div id="syn"></div><small>내 포켓몬 또는 대기석 선택 → 전장 하단 칸 터치</small><div id="bench" class="row"></div><div class="row"><button onclick="fight()" id="go">⚔ 전투 시작</button><button onclick="sell()">선택 판매</button><button onclick="roll()">리롤 2G</button><button onclick="save(true)">저장</button><button onclick="load()">이어하기</button><button onclick="reset()">새 게임</button></div><div id="log"></div><b>포켓몬 상점</b><div id="shop" class="row"></div><small>동일 포켓몬 3마리 합성 · 전투 종료 후 자동 저장 · 테스트용 수치 및 임시 그래픽</small></main><script>
const D=[['이상해씨','🌱','풀',1,160,18,100,'덩굴채찍','이상해풀','이상해꽃'],['파이리','🔥','불꽃',1,110,25,130,'화염방사','리자드','리자몽'],['꼬부기','🐢','물',1,190,17,35,'물대포','어니부기','거북왕'],['피카츄','⚡','전기',2,110,31,150,'십만볼트','라이츄','라이츄'],['구구','🐦','비행',1,115,22,35,'바람일으키기','피죤','피죤투'],['꼬마돌','🪨','바위',1,240,16,35,'돌떨구기','데구리','딱구리'],['고오스','👻','고스트',2,105,32,110,'섀도볼','고우스트','팬텀'],['아보','🐍','독',1,150,21,35,'독침','아보크','아보크'],['캐이시','🔮','에스퍼',2,90,36,170,'사이코키네시스','윤겔라','후딘'],['미뇽','🐉','드래곤',3,200,38,90,'용의파동','신뇽','망나뇽'],['쥬쥬','🦭','얼음',2,170,25,120,'냉동빔','쥬레곤','쥬레곤'],['모래두지','🦔','땅',1,180,20,35,'지진','고지','고지']];
const stages=[['상록숲','야생 포켓몬', [0,4]],['회색시티','웅 · 체육관 관장',[5,5,11]],['블루시티','이슬 · 체육관 관장',[2,2,10]],['갈색시티','마티스 · 체육관 관장',[3,3,4]],['무지개시티','민화 · 체육관 관장',[0,0,7]],['연분홍·노랑시티','독수와 초련',[7,6,8]],['홍련·상록시티','강연과 비주기',[1,11,5,1]],['석영고원','사천왕 칸나와 시바',[10,2,5,11]],['석영고원','사천왕 국화와 목호',[6,7,9,9]],['챔피언의 방','챔피언 그린',[4,8,9,1,2,0]]];
const W=[['☀️ 맑음','불꽃'],['🌧️ 가을비','물'],['🌫️ 안개','고스트'],['💨 강풍','비행'],['🍂 건조','풀']];const $=x=>document.getElementById(x),c=$('field'),ctx=c.getContext('2d');let s,sel=null,busy=false,units=[],fx=[],last=0,elapsed=0,frame=0,notice='';const rand=n=>Math.floor(Math.random()*n),pick=()=>Array.from({length:5},()=>rand(D.length)),unit=(d,l=1)=>({d,l}),name=u=>D[u.d][u.l===1?0:u.l+6];function fresh(){return {r:1,g:12,h:100,badges:0,board:[{d:2,l:1,p:2},{d:1,l:1,p:8}],bench:[],shop:pick(),w:[rand(5),rand(5),rand(5)],done:false}}function save(man){if(busy){if(man)log('전투 종료 후 저장할 수 있어요.');return}try{localStorage.setItem('projectp002',JSON.stringify(s));if(man)log('저장 완료')}catch(e){log('이 브라우저에서는 저장이 제한됩니다.')}}function load(){if(busy)return;try{let v=JSON.parse(localStorage.getItem('projectp002'));if(v&&Array.isArray(v.board)&&v.r>=1&&v.r<=10){s=v;sel=null;prep();log('저장된 여정을 불러왔어요.')}else log('저장 데이터가 없습니다.')}catch(e){log('저장 데이터를 읽을 수 없습니다.')}}function reset(){if(busy)return;if(!confirm('새 게임을 시작할까요? 기존 자동 저장이 덮어써집니다.'))return;s=fresh();sel=null;prep();save(false)}function log(t){notice=t;$('log').textContent=t}function counts(){let a={};for(let u of s.board){let t=D[u.d][2];a[t]=(a[t]||0)+1}return a}function render(){let st=stages[s.r-1];$('status').textContent=`❤️ ${s.h}  ·  💰 ${s.g}G  ·  ROUND ${s.r}/10  ·  배지 ${s.badges}/8`;$('story').textContent=s.done?(s.h>0?'🏆 관동 리그 챔피언 등극!':'도전 종료'):st[0]+' — '+st[1];$('weather').textContent=`가을 · ${W[s.w[0]][0]} (${W[s.w[0]][1]} 공격 +15%) | 예보: ${W[s.w[1]][0]} → ${W[s.w[2]][0]}`;$('syn').textContent='시너지: '+(Object.entries(counts()).map(([k,v])=>k+' '+v+(v>=2?' ✓':'')).join(' · ')||'없음');$('bench').innerHTML=s.bench.map((u,i)=>`<button class="card ${sel?.k==='q'&&sel.i===i?'sel':''}" onclick="choose('q',${i})">${D[u.d][1]}<br>${name(u)} ${'★'.repeat(u.l)}</button>`).join('')||'<small>대기석 비어 있음</small>';$('shop').innerHTML=s.shop.map((d,i)=>d===null?'<div class="card">—</div>':`<button class="card" onclick="buy(${i})">${D[d][1]}<br>${D[d][0]}<br>${D[d][4-1]}G</button>`).join('');$('go').disabled=busy||s.done||!s.board.length;draw()}
function prep(){units=[];fx=[];render()}function choose(k,i){if(busy||s.done)return;sel={k,i};render()}function buy(i){if(busy||s.done)return;let d=s.shop[i];if(d===null||s.g<D[d][3]||s.bench.length>=8)return;s.g-=D[d][3];s.bench.push(unit(d));s.shop[i]=null;merge();render();save(false)}function roll(){if(busy||s.done||s.g<2)return;s.g-=2;s.shop=pick();render();save(false)}function sell(){if(busy||s.done||!sel)return;let a=sel.k==='q'?s.bench:s.board,u=a[sel.i];if(u){s.g+=D[u.d][3]*3**(u.l-1);a.splice(sel.i,1)}sel=null;render();save(false)}function merge(){for(let l=1;l<3;l++)for(let d=0;d<D.length;d++){if(l===2&&D[d][8]===D[d][9])continue;let all=[...s.board,...s.bench].filter(u=>u.d===d&&u.l===l);while(all.length>=3){let a=all.splice(0,3),first=a[0];first.l++;s.board=s.board.filter(u=>!a.slice(1).includes(u));s.bench=s.bench.filter(u=>!a.slice(1).includes(u));sel=null;log(name(first)+' 진화!')}}}const pos=p=>({x:50+(p%6)*100,y:270+Math.floor(p/6)*85});c.onclick=e=>{if(busy||s.done)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*420/r.height;if(y<230)return;let p=Math.min(11,Math.floor(x/100)+6*(y>=312?1:0)),i=s.board.findIndex(u=>u.p===p);if(!sel){if(i>=0)choose('b',i);return}if(sel.k==='q'){if(i<0&&s.board.length>=Math.min(6,3+Math.floor(s.r/3))){log('배치 한도 도달');return}let u=s.bench.splice(sel.i,1)[0];if(!u)return;if(i>=0){let old=s.board.splice(i,1)[0];delete old.p;s.bench.push(old)}s.board.push({...u,p})}else{let u=s.board[sel.i];if(!u)return;if(i>=0)s.board[i].p=u.p;u.p=p}sel=null;render();save(false)};
function draw(){ctx.clearRect(0,0,600,420);for(let y=0;y<4;y++)for(let x=0;x<6;x++){ctx.fillStyle=(x+y)%2?'#355b45':'#3d684e';ctx.fillRect(x*100+1,y*105+1,98,103)}ctx.strokeStyle='#bdd5c5';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,210);ctx.lineTo(600,210);ctx.stroke();ctx.setLineDash([]);let list=busy?units:[...s.board.map(u=>({...u,...pos(u.p),side:0})),...stages[s.r-1][2].map((d,i)=>({d,l:s.r>=8?2:1,x:50+i*100,y:65+(i%2)*75,side:1}))];for(let u of list){if(u.hp<=0)continue;ctx.fillStyle=u.side?'#e66c74':'#7de6a2';ctx.beginPath();ctx.ellipse(u.x,u.y+12,23,9,0,0,7);ctx.fill();ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText(D[u.d][1],u.x,u.y+5);ctx.font='12px system-ui';ctx.fillStyle='white';ctx.fillText(name(u)+' '+ '★'.repeat(u.l),u.x,u.y+28);ctx.fillStyle='#17252a';ctx.fillRect(u.x-22,u.y-31,44,5);ctx.fillStyle=u.side?'#ff7777':'#8bffac';ctx.fillRect(u.x-22,u.y-31,44*(u.hp===undefined?1:Math.max(0,u.hp/u.max)),5);if(busy){ctx.fillStyle='#67bfff';ctx.fillRect(u.x-22,u.y-24,44*u.mana/100,3)}else if(sel?.k==='b'&&s.board[sel.i]?.p===u.p&&u.side===0){ctx.strokeStyle='gold';ctx.strokeRect(u.x-32,u.y-38,64,72)}}for(let f of fx){ctx.globalAlpha=Math.min(1,f.t*4);ctx.strokeStyle=f.color;ctx.lineWidth=f.skill?5:2;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.tx,f.ty);ctx.stroke();if(f.skill){ctx.fillStyle='white';ctx.font='13px system-ui';ctx.fillText(f.label,f.tx,f.ty-35)}ctx.globalAlpha=1}ctx.lineWidth=1}
function fighter(u,x,y,side,i){let d=D[u.d],mult=1.7**(u.l-1),enemy=side?1+s.r*.045:1;let max=d[4]*mult*enemy;return {...u,x,y,side,max,hp:max,atk:d[5]*mult*enemy,range:d[6],mana:0,cd:i*.13,speed:65+(u.d%4)*12}}function fight(){if(busy||s.done||!s.board.length)return;busy=true;sel=null;elapsed=0;fx=[];units=s.board.map((u,i)=>{let p=pos(u.p);return fighter(u,p.x,p.y,0,i)}).concat(stages[s.r-1][2].map((d,i)=>fighter(unit(d,s.r>=8?2:1),50+i*100,65+(i%2)*75,1,i)));last=performance.now();log('전투 진행 중');render();frame=requestAnimationFrame(tick)}function tick(now){let dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;let living=units.filter(u=>u.hp>0),hits=[],ct=counts();for(let u of living){let foes=living.filter(v=>v.side!==u.side);if(!foes.length)continue;let dist=v=>Math.hypot(v.x-u.x,v.y-u.y),target=foes.reduce((a,b)=>dist(a)<dist(b)?a:b);let dd=dist(target);u.cd-=dt;let type=D[u.d][2],active=!u.side&&ct[type]>=2;if(dd>u.range+12){let step=Math.min(dd-u.range,u.speed*dt);u.x+=(target.x-u.x)/dd*step;u.y+=(target.y-u.y)/dd*step}else if(u.cd<=0){let skill=u.mana>=80,damage=u.atk*(skill?2.2:1)*(type===W[s.w[0]][1]?1.15:1)*(active?1.15:1);u.cd=active&&type==='전기'?.56:.85+u.d%3*.13;u.mana=skill?0:Math.min(100,u.mana+24);hits.push([target,damage]);fx.push({x:u.x,y:u.y,tx:target.x,ty:target.y,t:.28,color:skill?'#ffcf68':u.side?'#ff8c92':'#b8ecff',skill,label:D[u.d][7]});if(skill){for(let v of foes)if(v!==target&&Math.hypot(v.x-target.x,v.y-target.y)<85)hits.push([v,damage*.35])}if(active&&type==='풀')u.hp=Math.min(u.max,u.hp+4)}}for(let i=0;i<living.length;i++)for(let j=i+1;j<living.length;j++){let a=living[i],b=living[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<28){let z=(28-d)*.25;a.x-=dx/d*z;a.y-=dy/d*z;b.x+=dx/d*z;b.y+=dy/d*z}}for(let u of living){u.x=Math.max(22,Math.min(578,u.x));u.y=Math.max(35,Math.min(390,u.y))}for(let [v,d] of hits)v.hp-=d;fx=fx.filter(f=>(f.t-=dt)>0);draw();let a=units.filter(u=>u.side===0&&u.hp>0),b=units.filter(u=>u.side===1&&u.hp>0);if(!a.length||!b.length||elapsed>45){finish(a.length>0&&!b.length);return}frame=requestAnimationFrame(tick)}function finish(win){busy=false;let r=s.r;if(win){s.g+=8+Math.min(5,Math.floor(s.g/10));if(r>=2&&r<=7)s.badges+=r>=6?2:1;if(r===10)s.done=true;else s.r++;log(r===10?'🏆 챔피언 등극!':stages[r-1][1]+' 승리! 다음 장소로 이동합니다.')}else{s.h=Math.max(0,s.h-12);s.g+=5;if(!s.h)s.done=true;log('패배 — 체력 12 감소. 덱을 정비하고 재도전하세요.')}s.shop=pick();s.w.shift();s.w.push(rand(5));prep();save(false)}s=fresh();prep();try{if(localStorage.getItem('projectp002'))load()}catch(e){log('저장 기능을 사용할 수 없는 환경입니다.')}
</script></html>
